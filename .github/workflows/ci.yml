# 像素蛋糕 Windows 客户端 CI：编译测试 + 打包安装包
# 在 GitHub 托管的 windows-latest（自带 MSVC + Windows SDK + WebView2）上执行，
# 解决本地缺链接器的问题。产物为 NSIS 安装包 (.exe)。
#
# 说明：图标文件（icon.ico / icon.png / 16-256 多尺寸）已入库，CI 直接用。
# 源图与处理脚本在 assets-logo/（不入库，开发者本地生成新图标时用）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # LibRaw 静态链接需定义 LIBRAW_NODLL，否则 MSVC 报 C2491 dllimport 冲突
  # （libraw-rs-sys 的 build.rs 未内置此宏，故经 cc crate 的 CXXFLAGS 传入）
  CXXFLAGS: -DLIBRAW_NODLL
  CFLAGS: -DLIBRAW_NODLL

jobs:
  test:
    name: 编译与单元测试
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: cargo build（workspace）
        run: cargo build --workspace

      - name: cargo test（workspace）
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace

  package:
    name: 打包安装包
    needs: test
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci

      - name: Tauri 打包（NSIS）
        working-directory: apps/desktop
        run: npm run tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: pixel-cake-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/*.exe
          if-no-files-found: error
